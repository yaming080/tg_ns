name: Initialize new sources (no Telegram sending)
on:
  workflow_dispatch:
concurrency:
  group: telegram-news-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reserve publication and recover confirmed state
        id: publication_guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python news_state_guard.py begin

      - name: Save source baselines without sending
        id: run_bot
        run: |
          python -u - <<'PY'
          from doorinews_bot import load_state, save_state, STATE_FILE, http_get
          from news_sources import collect_new_sources, NEW_FEEDS
          state = load_state(STATE_FILE)
          collect_new_sources(state, http_get, lambda s: save_state(STATE_FILE, s))
          missing = [name for name, url in NEW_FEEDS if url not in state.get('source_baselines', {})]
          print('NO_TELEGRAM_SEND: baseline initialization only')
          if missing:
              raise SystemExit('NOT_INITIALIZED: ' + ', '.join(missing))
          print('ALL_SOURCE_BASELINES_SAVED')
          PY
      - name: Preserve publication state for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            news_state.json
            news_publication_guard.json
          if-no-files-found: error
          retention-days: 30

      - name: news state 저장
        id: persist_state
        if: ${{ always() && steps.publication_guard.outcome == 'success' && steps.run_bot.outcome == 'success' }}
        run: python news_state_guard.py finish

      - name: Explain blocked or interrupted publication
        if: ${{ always() && (steps.publication_guard.outcome != 'success' || steps.run_bot.outcome != 'success' || steps.persist_state.outcome != 'success') }}
        run: |
          echo "게시 보호 절차 또는 이력 저장이 완료되지 않았습니다. 발송 성공 로그와 publication-state 백업을 확인하세요. 원격 진행 표식이 pending이면 복구 전 다음 자동 발송이 차단됩니다." >> "$GITHUB_STEP_SUMMARY"
