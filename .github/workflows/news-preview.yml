name: News Preview (no Telegram sending)
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Prepare text and image previews
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4
        run: python preview_news.py --input preview_input.json --output preview --limit 5
      - name: Save preview files
        uses: actions/upload-artifact@v4
        with:
          name: news-preview
          path: preview/
