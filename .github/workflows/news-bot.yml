name: Telegram News Bot

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 편집 규칙 테스트
        run: python -m unittest discover -s tests -v

      - name: Reserve publication and recover confirmed state
        id: publication_guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python news_state_guard.py begin

      - name: 봇 실행
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-6-luna"
          # Temporary total-use cap until free-credit balance is verified.
          NEWS_MONTHLY_API_BUDGET_USD: "5"
          INITIAL_RUN: "false"
        run: python doorinews_bot.py

      - name: Preserve publication state for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            news_state.json
            news_publication_guard.json
          if-no-files-found: error
          retention-days: 30

      - name: news state 저장
        id: persist_state
        if: ${{ always() && steps.publication_guard.outcome == 'success' && steps.run_bot.outcome == 'success' }}
        run: python news_state_guard.py finish

      - name: Explain blocked or interrupted publication
        if: ${{ always() && (steps.publication_guard.outcome != 'success' || steps.run_bot.outcome != 'success' || steps.persist_state.outcome != 'success') }}
        run: |
          echo "게시 보호 절차 또는 이력 저장이 완료되지 않았습니다. 발송 성공 로그와 publication-state 백업을 확인하세요. 원격 진행 표식이 pending이면 복구 전 다음 자동 발송이 차단됩니다." >> "$GITHUB_STEP_SUMMARY"
