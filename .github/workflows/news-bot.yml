name: Telegram News Bot

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 편집 규칙 테스트
        run: python -m unittest discover -s tests -v

      - name: 봇 실행
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.4"
          INITIAL_RUN: "false"
        run: python doorinews_bot.py

      - name: news state 저장
        if: ${{ always() && steps.run_bot.outcome != 'skipped' }}
        run: |
          test -f news_state.json
          python -c "import json; json.load(open('news_state.json', encoding='utf-8'))"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_state.json
          git diff --cached --quiet || git commit -m "Update news state"
          git pull --rebase origin main
          git push origin HEAD:main
