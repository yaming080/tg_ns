name: News model compatibility (no publication)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'verify_budget_api.py'
      - '.github/workflows/news-model-check.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'news-current-budget-20261101')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate existing rules and budget guards
        run: python -m unittest discover -s tests -v
      - name: Verify Luna image and Sol factual-check route without posting
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python verify_budget_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-validation-usage
          path: model-validation-usage.json
          retention-days: 14
